<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 18th Birthday Kariuki 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:radial-gradient(circle at top,#2b0a3d,#120018 60%,#0a0010);
color:#fff;
overflow:hidden;
padding:20px;
opacity:0;
animation:pageIn 1.2s ease forwards;
}

@keyframes pageIn{
to{opacity:1;}
}

.glowOrb{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
filter:blur(80px);
opacity:0.35;
animation:float 8s ease-in-out infinite;
}

.orb1{
background:#c850c0;
top:-80px;
left:-80px;
}

.orb2{
background:#8e2de2;
bottom:-100px;
right:-100px;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(30px);}
}

.card{
max-width:620px;
width:100%;
padding:40px 30px;
border-radius:28px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
backdrop-filter:blur(14px);
box-shadow:0 20px 60px rgba(0,0,0,0.6);
text-align:center;
animation:cardIn 1.5s ease;
position:relative;
z-index:2;
}

@keyframes cardIn{
from{transform:translateY(25px); opacity:0;}
to{transform:translateY(0); opacity:1;}
}

h1{
font-size:38px;
margin-bottom:18px;
background:linear-gradient(90deg,#ff9ecf,#ffffff,#d896ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
font-size:16px;
opacity:0.8;
margin-bottom:20px;
}

.typing{
font-size:19px;
line-height:1.8;
min-height:90px;
margin:20px 0;
color:#f8e9ff;
}

.extra{
font-size:18px;
line-height:1.8;
margin:15px 0;
color:#ffe6f7;
opacity:0.95;
}

.cursor{
display:inline-block;
width:8px;
background:#fff;
margin-left:4px;
animation:blink 0.8s infinite;
}

@keyframes blink{
50%{opacity:0;}
}

button{
margin-top:20px;
padding:14px 26px;
border:none;
border-radius:50px;
background:linear-gradient(90deg,#c850c0,#8e2de2);
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
box-shadow:0 10px 25px rgba(200,80,192,0.3);
transition:0.25s;
}

button:hover{
transform:scale(1.05);
}

.surprise{
display:none;
margin-top:25px;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
animation:fadeIn 1s ease;
}

.surpriseText{
font-size:17px;
line-height:1.7;
color:#ffffff;
min-height:120px;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

.heart{
position:absolute;
font-size:16px;
animation:rise 6s linear forwards;
opacity:0.7;
}

@keyframes rise{
from{transform:translateY(100vh); opacity:0;}
10%{opacity:1;}
to{transform:translateY(-10vh); opacity:0;}
}

</style>
</head>

<body>

<div class="glowOrb orb1"></div>
<div class="glowOrb orb2"></div>

<div class="card">

<h1>Happy 18th Birthday Kariuki 💖</h1>
<div class="subtitle">A little message made just for him ✨</div>

<div class="typing" id="typing"></div>

<div class="extra">
May God bless him with many more beautiful years, endless smiles, and a heart that always feels loved.<br><br>
Because my world honestly feels brighter with him in it ✨
</div>

<button onclick="showSurprise()">Open His Surprise 💌</button>

<div class="surprise" id="surprise">
<div class="surpriseText" id="surpriseText"></div>
</div>

</div>

<script>

const text =
"Kariuki… turning 18 feels special, but not as special as him. He is loved, appreciated, and honestly unforgettable 💖";

let i = 0;

function typeMain(){
if(i < text.length){
document.getElementById("typing").innerHTML =
text.substring(0,i) + '<span class="cursor"></span>';
i++;
setTimeout(typeMain,40);
}
}
typeMain();

const surpriseMessage =
"Kariuki… he is not just handsome on the outside, but also rare in the way he makes life feel softer for someone who truly cares about him ✨ " +
"I hope his 18th year brings him peace, growth, happiness, and people who value his heart the way it deserves 💖 " +
"And if I’m being honest… I hope I get to be one of the reasons he smiles a little more often 🌹";

let j = 0;
let typingStarted = false;

function typeSurprise(){
if(j < surpriseMessage.length){
document.getElementById("surpriseText").innerHTML =
surpriseMessage.substring(0,j) + '<span class="cursor"></span>';
j++;
setTimeout(typeSurprise,35);
}
}

function showSurprise(){
document.getElementById("surprise").style.display="block";
if(!typingStarted){
typingStarted = true;
typeSurprise();
}
}

function heartRain(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML=["💖","💜","💗"][Math.floor(Math.random()*3)];
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*10+14)+"px";
heart.style.animationDuration=(Math.random()*3+4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
}
setInterval(heartRain,900);

</script>

</body>
</html>
